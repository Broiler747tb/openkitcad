<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>OpenKitCAD — repository cover</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1280px;
      height: 640px;
      overflow: hidden;
      background: #050708;
      color: #f2f6f8;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .cover {
      position: relative;
      width: 1280px;
      height: 640px;
      overflow: hidden;
    }
    .model {
      position: absolute;
      left: 520px;
      top: -25px;
      width: 760px;
      height: auto;
      mask-image: linear-gradient(90deg, transparent, #000 17%);
    }
    .mark {
      position: absolute;
      left: 64px;
      top: 66px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #a0b4c1;
      font-size: 17px;
    }
    .text {
      position: absolute;
      left: 64px;
      top: 239px;
    }
    h1 {
      margin: 0;
      font-size: 68px;
      line-height: 1;
      letter-spacing: -2.5px;
      font-weight: 700;
    }
    h1 span {
      color: #72c6d7;
    }
    p {
      margin: 25px 0 0;
      font-size: 25px;
      color: #c3d0d7;
      line-height: 1.5;
    }
    .formats {
      margin-top: 23px;
      color: #7e929f;
      font-size: 17px;
      letter-spacing: 2px;
    }
    .platforms {
      position: absolute;
      left: 64px;
      bottom: 65px;
      font-size: 17px;
      color: #94a9b7;
      letter-spacing: 1.4px;
    }
    .platforms b {
      font-weight: 500;
      color: #deebf1;
    }
  </style>
  <div class="cover">
    <img class="model" src="images/printer.png" alt="An original Cartesian 3D printer assembly" />
    <div class="mark">
      <svg viewBox="0 0 32 32" width="42" height="42" aria-label="OpenKitCAD logo">
        <rect x="1" y="1" width="30" height="30" rx="7" fill="#1676c5" />
        <path d="M7 15.5L16 20.5L25 15.5V24.5L16 29.5L7 24.5Z" fill="#fff" fill-opacity=".22" />
        <path
          d="M7 15.5L16 20.5L25 15.5M16 20.5V29.5M7 15.5V24.5L16 29.5L25 24.5V15.5"
          fill="none"
          stroke="#fff"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <path
          d="M7 15.5L16 10.5L25 15.5"
          fill="none"
          stroke="#fff"
          stroke-width="1.7"
          stroke-linejoin="round"
          stroke-dasharray="2.2 1.8"
        />
        <path
          d="M16 10.5L20.5 4L29 8.5L25 15.5Z"
          fill="#fff"
          stroke="#fff"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
      </svg>
      <span>Open source. On your workbench.</span>
    </div>
    <div class="text">
      <h1>OpenKit<span>CAD</span></h1>
      <p>CAD for 3D printing<br />and the hardware inside.</p>
      <div class="formats">STEP &nbsp;·&nbsp; STL &nbsp;·&nbsp; 3MF</div>
    </div>
    <div class="platforms"><b>BROWSER</b> &nbsp;/&nbsp; <b>WINDOWS PORTABLE</b></div>
  </div>
</html>
